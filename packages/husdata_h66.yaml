# Husdata H60/H66 -> Home Assistant via MQTT
#
# Anvand ANTINGEN det har paketet ELLER H66:ns auto-discovery (MQTT_DISCOV=1),
# aldrig bada samtidigt. Da far du dubbletter av varje entitet.
#
# For det har paketet, satt i H66 (Config):
#   MQTT_SRVR   = IP till Home Assistant
#   MQTT_PORT   = 1883
#   MQTT_USER / MQTT_PASS = samma som i Mosquitto-addonet
#   MQTT_DISCOV = 0
#   MQTT_PUBALL = 20
#
# Topicen "+/HP/0001" anvander wildcard for H66:ns MAC-adress, sa du slipper
# skriva in den. Har du flera gateways: byt ut "+" mot MAC-adressen.
#
# Alla register finns inte i alla varmepumpar. Ta bort de rader som visar
# "unknown" for just din modell (H66:ns startsida listar dina giltiga IDX).

mqtt:
  sensor:
    - name: "Radiator return"
      object_id: hp_radiator_return
      unique_id: husdata_h66_0001
      state_topic: "+/HP/0001"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      device: &h66_device
        identifiers: husdata_h66
        name: "Varmepump"
        manufacturer: Husdata
        model: "H66 Gateway"

    - name: "Radiator forward"
      object_id: hp_radiator_forward
      unique_id: husdata_h66_0002
      state_topic: "+/HP/0002"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      device: *h66_device

    - name: "Heat carrier return"
      object_id: hp_heat_carrier_return
      unique_id: husdata_h66_0003
      state_topic: "+/HP/0003"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      device: *h66_device

    - name: "Heat carrier forward"
      object_id: hp_heat_carrier_forward
      unique_id: husdata_h66_0004
      state_topic: "+/HP/0004"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      device: *h66_device

    - name: "Brine in / Evaporator"
      object_id: hp_brine_in
      unique_id: husdata_h66_0005
