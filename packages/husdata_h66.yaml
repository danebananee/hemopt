      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      device: *h66_device

    - name: "Outdoor"
      object_id: hp_outdoor
      unique_id: husdata_h66_0007
      state_topic: "+/HP/0007"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      device: *h66_device

    - name: "Indoor"
      object_id: hp_indoor
      unique_id: husdata_h66_0008
      state_topic: "+/HP/0008"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      device: *h66_device

    - name: "Warm water 1 / Top"
