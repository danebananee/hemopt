      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      device: *h66_device

    - name: "Hot gas / Compressor"
      object_id: hp_hot_gas
      unique_id: husdata_h66_000B
      state_topic: "+/HP/000B"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      device: *h66_device

    - name: "Heating setpoint"
      object_id: hp_heating_setpoint
      unique_id: husdata_h66_0107
      state_topic: "+/HP/0107"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      device: *h66_device

    - name: "Warm water setpoint"
      object_id: hp_warm_water_setpoint
      unique_id: husdata_h66_0111
      state_topic: "+/HP/0111"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      device: *h66_device

    - name: "Add heat status"
      object_id: hp_add_heat
      unique_id: husdata_h66_3104
      state_topic: "+/HP/3104"
      unit_of_measurement: "%"
      state_class: measurement
      icon: mdi:flash
      device: *h66_device

    # Installningar som lases av for matarna. Vill du kunna andra dem fran
    # Home Assistant, se "number"-blocket langst ner i filen.
    - name: "Room temp target"
      object_id: hp_room_temp_target
      unique_id: husdata_h66_0203
      state_topic: "+/HP/0203"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      device: *h66_device

    - name: "Curve"
      object_id: hp_curve
      unique_id: husdata_h66_2205
      state_topic: "+/HP/2205"
      state_class: measurement
      icon: mdi:chart-bell-curve-cumulative
      device: *h66_device

    - name: "Curve fine"
      object_id: hp_curve_fine
      unique_id: husdata_h66_0207
      state_topic: "+/HP/0207"
      state_class: measurement
      icon: mdi:tune-vertical
      device: *h66_device

  binary_sensor:
    - name: "Compressor"
      object_id: hp_compressor
