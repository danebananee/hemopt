# Golvvärme — LK-sensorer + husbörvärde via H66
#
# LK Arc-rumsgivarna syns bara som sensor.* (temperatur/fukt/batteri).
# Det finns ingen climate.<mac>_thermostat att styra per rum.
#
# När hemopt har «Styr värmen» på skrivs husets inomhusbörvärde till
# climate.h66_hproom_temp_setpoint (kräver ofta ROOM_CTRL=1 på H66).
# Önskad komforttemp per rum ställer du i hemopt-panelen — medel av
# prio-1-rum blir husbörvärdet.

title: Golvvärme

views:
  - title: Golvvärme
    path: golvvarme
    icon: mdi:heating-coil
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Husets rumsbörvärde (H66)
            icon: mdi:thermostat
          - type: tile
            entity: climate.h66_hproom_temp_setpoint
            name: Önskad rumstemperatur
            features:
              - type: target-temperature
          - type: markdown
            content: >
              LK-givarna är **bara sensorer**. hemopt läser dem för planen och
              skriver ett gemensamt börvärde hit när «Styr värmen» är på.
              Saknas entiteten: kolla H66 (`ROOM_CTRL`) och Developer tools →
              States efter `hproom`.

      - type: grid
        cards:
          - type: heading
            heading: Bottenvåning
            icon: mdi:home-floor-0
          - type: history-graph
            title: Temperatur senaste dygnet
            hours_to_show: 24
            entities:
