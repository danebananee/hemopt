# Golvvärme — temperatur + reglage per rum (LK Arc)
#
# Sensorerna visar temperatur/fukt/batteri. Börvärdet ställs på climate.*
# (samma MAC-suffix som givaren). Kontrollera under Developer tools → States
# att climate.xxx finns; vissa installationer heter climate.xxx_thermostat.
#
# Klistra in views:-delen i din dashboard, eller importera hela filen.
#
# Obs: när hemopt har «Styr värmen» på skrivs börvärden om enligt planen.
# Manuala reglage gäller tills nästa styrcykel — eller stäng av styrningen.

title: Golvvärme

views:
  - title: Golvvärme
    path: golvvarme
    icon: mdi:heating-coil
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Bottenvåning
            icon: mdi:home-floor-0
          - type: history-graph
            title: Temperatur senaste dygnet
            hours_to_show: 24
            entities:
              - entity: sensor.e0_ec_2c_c8_5e_2c_temperature
                name: Tvättstuga
              - entity: sensor.e9_bd_23_4a_e9_a8_temperature
                name: Salong
              - entity: sensor.ce_9f_90_cd_bf_74_temperature
                name: Lekrum
              - entity: sensor.ca_97_f7_ba_7d_23_temperature
                name: Entré

          - type: tile
            entity: climate.e0_ec_2c_c8_5e_2c
            name: Tvättstuga
            features:
              - type: target-temperature
          - type: tile
            entity: climate.e9_bd_23_4a_e9_a8
            name: Salong
            features:
              - type: target-temperature
          - type: tile
            entity: climate.ce_9f_90_cd_bf_74
            name: Lekrum
            features:
              - type: target-temperature
          - type: tile
            entity: climate.ca_97_f7_ba_7d_23
            name: Entré
            features:
              - type: target-temperature

