# Golvvärme — LK Arc sensorer + termostater
#
# Temperatur/fukt/batteri kommer från ha-lksystems (sensor.*).
# Skrivbara börvärden kräver custom_components/lk_arc_climate →
# climate.<mac>_thermostat på samma enhet.
#
# När hemopt har «Styr värmen» på skrivs climate_entity per rum.
# Önskad komforttemp ställer du i hemopt-panelen.

title: Golvvärme

views:
  - title: Golvvärme
    path: golvvarme
    icon: mdi:heating-coil
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: markdown
            content: |
              **Termostater = `climate.*_thermostat` (LK Arc Climate).**
              Om korten nedan visar *Entity not found*: Update hemopt till **0.1.25+**,
              Restart tillägget, vänta på att HA startar om (hemopt gör det en gång),
              ladda om denna sida. Sensorerna i grafen/tabellen fungerar ändå.
          - type: heading
            heading: Bottenvåning
            icon: mdi:home-floor-0
          - type: history-graph
            title: Temperatur senaste dygnet
            hours_to_show: 24
            entities:
              - entity: sensor.e0_ec_2c_c8_5e_2c_temperature
                name: Tvättstuga
              - entity: sensor.e9_bd_23_4a_e9_a8_temperature
                name: Salong
              - entity: sensor.ce_9f_90_cd_bf_74_temperature
                name: Lekrum
              - entity: sensor.ca_97_f7_ba_7d_23_temperature
                name: Entré

          - type: tile
            entity: climate.e0_ec_2c_c8_5e_2c_thermostat
            name: Tvättstuga
            features:
              - type: target-temperature
          - type: tile
            entity: climate.e9_bd_23_4a_e9_a8_thermostat
            name: Salong
            features:
              - type: target-temperature
          - type: tile
            entity: climate.ce_9f_90_cd_bf_74_thermostat
            name: Lekrum
            features:
              - type: target-temperature
          - type: tile
            entity: climate.ca_97_f7_ba_7d_23_thermostat
            name: Entré
            features:
              - type: target-temperature

      - type: grid
        cards:
          - type: heading
            heading: Övervåning
            icon: mdi:home-floor-1
          - type: history-graph
            title: Temperatur senaste dygnet
            hours_to_show: 24
            entities:
              - entity: sensor.d5_ba_fd_c1_0c_c1_temperature
                name: Garderob
              - entity: sensor.c8_1b_04_e0_7e_90_temperature
                name: Sovrum
              - entity: sensor.fa_6a_ee_c8_9a_63_temperature
                name: Vardagsrum
              - entity: sensor.f7_d4_23_14_49_da_temperature
                name: Badrum
              - entity: sensor.e3_09_14_3f_f0_f0_temperature
                name: Pysselrum
              - entity: sensor.e6_5e_d9_54_a8_e7_temperature
                name: Rios rum
              - entity: sensor.d0_f5_31_05_49_9d_temperature
                name: Kontor

          - type: tile
            entity: climate.d5_ba_fd_c1_0c_c1_thermostat
            name: Garderob
            features:
              - type: target-temperature
          - type: tile
            entity: climate.c8_1b_04_e0_7e_90_thermostat
            name: Sovrum
            features:
              - type: target-temperature
          - type: tile
            entity: climate.fa_6a_ee_c8_9a_63_thermostat
            name: Vardagsrum
            features:
              - type: target-temperature
          - type: tile
            entity: climate.f7_d4_23_14_49_da_thermostat
            name: Badrum
