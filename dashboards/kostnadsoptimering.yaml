# Kostnadsoptimering — Home Assistant-dashboard for hemopt
#
# Krav: MQTT igang sa enheten "Kostnadsoptimering" finns.
# Klistra in som egen dashboard eller som vyer i befintlig.
#
# Inspiration: driftpaneler (energioptimerare) — "nu", "vad gor systemet",
# plan/prognos, sedan detaljer. Prioritet 1 = hall temp, 3 = far svaja.

title: Kostnadsoptimering

views:
  - title: Drift
    path: drift
    icon: mdi:gauge
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.hemopt_peak_guard
                state: "on"
            card:
              type: markdown
              content: >-
                ## Effektvakten begransar just nu


                Uttaget ligger nara manadens effekttroskel. Vanta med tvatt,
                tork och elbilsladdning tills timmen ar slut.


                {{ states('sensor.hemopt_guard_reason') }}

      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Just nu
            heading_style: title
            icon: mdi:flash-circle
          - type: tile
            entity: sensor.hemopt_total_price
            name: Elpris
            icon: mdi:cash
          - type: tile
            entity: sensor.hemopt_planned_power
            name: Planerad VP-effekt
            icon: mdi:heat-pump
          - type: tile
            entity: sensor.hemopt_hour_headroom
            name: Effektutrymme denna timme
            icon: mdi:speedometer
          - type: tile
            entity: switch.hemopt_control_enabled
            name: Styr varmen
            icon: mdi:robot
            features:
              - type: toggle

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Vad gor modellen
            heading_style: title
            icon: mdi:text-box-outline
          - type: markdown
            grid_options:
              columns: full
            content: >-
              ### {{ states('sensor.hemopt_model_action') }}


              {{ states('sensor.hemopt_model_actions') }}


              ---

              Billigaste timme **{{ states('sensor.hemopt_cheapest_hour') }}** ·
              dyraste **{{ states('sensor.hemopt_most_expensive_hour') }}** ·
              planerad besparing **{{ states('sensor.hemopt_planned_saving') }}** kr
          - type: tile
            entity: binary_sensor.hemopt_preheating
            name: Forvarmer
            color: red
          - type: tile
            entity: binary_sensor.hemopt_heating_blocked
            name: Uppvarmning pausad
            color: orange
          - type: tile
            entity: binary_sensor.hemopt_peak_guard
            name: Effektvakt
            color: amber
          - type: tile
            entity: sensor.hemopt_advice_top
            name: Basta avtalsrad
            icon: mdi:lightbulb-on

      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Plan och pris
            heading_style: title
            icon: mdi:chart-timeline-variant
          - type: history-graph
            title: Planerad effekt (24 h)
            hours_to_show: 24
            grid_options:
              columns: full
            entities:
              - entity: sensor.hemopt_planned_power
                name: VP
              - entity: sensor.hemopt_hour_headroom
                name: Utrymme
          - type: history-graph
            title: Elpris
            hours_to_show: 24
            grid_options:
              columns: full
            entities:
              - entity: sensor.hemopt_total_price
                name: Totalpris

      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Rum — prioritet och borvarde
            heading_style: title
            icon: mdi:home-thermometer
          - type: markdown
            grid_options:
              columns: full
            content: >-
              **1 = hall temperaturen** (hogst). **3 = far svaja** och bar
              lastflytten. Onskad temp andrar du i hemopt-panelen (Rum).
          - type: entities
            title: Overvaning — prioritet
            grid_options:
              columns: 12
            entities:
              - entity: number.hemopt_priority_vardagsrum
                name: Vardagsrum
              - entity: number.hemopt_priority_sovrum
                name: Sovrum
              - entity: number.hemopt_priority_badrum
                name: Badrum
              - entity: number.hemopt_priority_kontor
                name: Kontor
              - entity: number.hemopt_priority_rios_rum
                name: Rios rum
              - entity: number.hemopt_priority_pysselrum
                name: Pysselrum
              - entity: number.hemopt_priority_garderob
                name: Garderob
          - type: entities
            title: Bottenvaning — prioritet
            grid_options:
              columns: 12
            entities:
              - entity: number.hemopt_priority_salong
                name: Salong
              - entity: number.hemopt_priority_lekrum
                name: Lekrum
              - entity: number.hemopt_priority_entre
                name: Entre
              - entity: number.hemopt_priority_tvattstuga
                name: Tvattstuga
          - type: history-graph
            title: Planerade borvarden
            hours_to_show: 24
            grid_options:
              columns: full
            entities:
              - entity: sensor.hemopt_setpoint_vardagsrum
                name: Vardagsrum
              - entity: sensor.hemopt_setpoint_sovrum
                name: Sovrum
              - entity: sensor.hemopt_setpoint_badrum
                name: Badrum
              - entity: sensor.hemopt_setpoint_salong
                name: Salong
              - entity: sensor.hemopt_setpoint_lekrum
                name: Lekrum

      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Troighet (larnt)
            heading_style: subtitle
            icon: mdi:timer-sand
          - type: glance
            grid_options:
              columns: full
            show_name: true
            show_state: true
            columns: 4
            entities:
              - entity: sensor.hemopt_inertia_vardagsrum
                name: Vardagsrum
              - entity: sensor.hemopt_inertia_sovrum
                name: Sovrum
              - entity: sensor.hemopt_inertia_badrum
                name: Badrum
              - entity: sensor.hemopt_inertia_kontor
                name: Kontor
              - entity: sensor.hemopt_inertia_salong
                name: Salong
              - entity: sensor.hemopt_inertia_lekrum
                name: Lekrum
              - entity: sensor.hemopt_inertia_entre
                name: Entre
              - entity: sensor.hemopt_inertia_tvattstuga
                name: Tvattstuga
