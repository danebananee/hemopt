name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Lint and test hemopt
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hemopt
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  slingkoll:
    name: Lint and test slingkoll
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: slingkoll
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pytest ruff
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  addon:
    name: Validate add-on manifest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        addon: [hemopt, slingkoll]
    steps:
      - uses: actions/checkout@v4
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./${{ matrix.addon }}
