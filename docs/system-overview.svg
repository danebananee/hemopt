<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">hemopt — så hänger systemet ihop</title>
  <desc id="desc">Flöde från indata via hemopt-motorn till styrning av LK Arc och IVT Rego 1000</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b45309"/>
    </marker>
    <style>
      .title { font: 700 28px DejaVu Sans, sans-serif; fill: #0f172a; }
      .sub { font: 400 14px DejaVu Sans, sans-serif; fill: #64748b; }
      .col { font: 700 12px DejaVu Sans, sans-serif; fill: #0f172a; letter-spacing: .06em; }
      .t { font: 700 15px DejaVu Sans, sans-serif; fill: #0f172a; }
      .s { font: 400 13px DejaVu Sans, sans-serif; fill: #475569; }
      .m { font: 500 12px DejaVu Sans Mono, monospace; fill: #334155; }
      .lbl { font: 500 11px DejaVu Sans, sans-serif; fill: #64748b; }
      .panel { fill: #fff; stroke: #e2e8f0; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1400" height="980" fill="#f8fafc"/>
  <text x="48" y="48" class="title">hemopt — så hänger systemet ihop</text>
  <text x="48" y="74" class="sub">Data in → modell → plan → styrning · Raspberry Pi / Docker · Home Assistant som nav</text>

  <rect x="40" y="110" width="260" height="810" rx="18" class="panel"/>
  <text x="60" y="140" class="col">INDATA</text>

  <rect x="340" y="110" width="700" height="810" rx="18" class="panel"/>
  <text x="360" y="140" class="col">HEMOPT-MOTOR</text>
  <text x="540" y="140" class="sub">varje minut · planerar varje kvart</text>

  <rect x="1080" y="110" width="280" height="810" rx="18" class="panel"/>
  <text x="1100" y="140" class="col">UTDATA</text>

  <!-- inputs -->
  <g>
    <rect x="60" y="160" width="220" height="90" rx="12" fill="#ecfeff" stroke="#5eead4" stroke-width="2"/>
    <text x="76" y="186" class="t">Nordpool SE3</text>
    <text x="76" y="208" class="s">Kvartspriser via</text>
    <text x="76" y="226" class="s">elprisetjustnu.se</text>
    <text x="76" y="240" class="m">prices.py</text>

    <rect x="60" y="268" width="220" height="110" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <text x="76" y="294" class="t">Home Assistant</text>
    <text x="76" y="316" class="s">Rum · LK Arc</text>
    <text x="76" y="334" class="s">H66 ute / effekt / VV</text>
    <text x="76" y="352" class="s">Husets elmätare</text>
    <text x="76" y="368" class="m">ha.py</text>

    <rect x="60" y="396" width="220" height="90" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    <text x="76" y="422" class="t">Väderprognos</text>
    <text x="76" y="444" class="s">Timtemperatur 36 h</text>
    <text x="76" y="462" class="m">weather.get_forecasts</text>

    <rect x="60" y="504" width="220" height="90" rx="12" fill="#fefce8" stroke="#fde047" stroke-width="2"/>
    <text x="76" y="530" class="t">Din config</text>
    <text x="76" y="552" class="s">Rumsprioritet 1–5</text>
    <text x="76" y="570" class="s">Komfortband · EXT</text>
    <text x="76" y="586" class="m">config.yaml</text>

    <rect x="60" y="612" width="220" height="90" rx="12" fill="#faf5ff" stroke="#d8b4fe" stroke-width="2"/>
    <text x="76" y="638" class="t">SQLite-minne</text>
    <text x="76" y="660" class="s">Tröghetsmodeller</text>
    <text x="76" y="678" class="s">VV-profil · toppar</text>
    <text x="76" y="694" class="m">storage.py</text>

    <rect x="60" y="720" width="220" height="80" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
    <text x="76" y="746" class="t">hemopt doctor</text>
    <text x="76" y="768" class="s">Verifierar varje entitet</text>
    <text x="76" y="786" class="s">föreslår rätt ID:n</text>
  </g>

  <!-- engine -->
  <g>
    <rect x="360" y="160" width="200" height="95" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
    <text x="376" y="186" class="t">1. Samla</text>
    <text x="376" y="208" class="s">States + historik</text>
    <text x="376" y="226" class="s">från HA</text>
    <text x="376" y="244" class="m">engine.collect</text>

    <rect x="600" y="160" width="220" height="95" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
    <text x="616" y="186" class="t">2. Lär</text>
    <text x="616" y="208" class="s">Tröghet · VV · baslast</text>
    <text x="616" y="226" class="s">minstakvadrat</text>
    <text x="616" y="244" class="m">thermal / hotwater</text>

    <rect x="360" y="290" width="660" height="150" rx="14" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
    <text x="380" y="322" class="t">3. Planera 36 h (LP / HiGHS)</text>
    <text x="380" y="350" class="s">Minimera: energi + effektavgift + komfortstraff</text>
    <text x="380" y="372" class="s">Förvärm rum &amp; varmvatten före dyra timmar</text>
    <text x="380" y="394" class="s">Respektera rumsprioritet och effekttak</text>
    <text x="380" y="420" class="m">optimizer.solve · ~0,3 s på Pi</text>

    <rect x="360" y="470" width="660" height="130" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
    <text x="380" y="502" class="t">4. Effektvakt (varje minut)</text>
    <text x="380" y="530" class="s">Hur mycket energi är kvar i denna klocktimme?</text>
    <text x="380" y="552" class="s">Får värmepumpen fortsätta? Komfort vinner över tariff.</text>
    <text x="380" y="578" class="m">guard.evaluate · hysteresis · max blocktid</text>

    <rect x="360" y="630" width="290" height="100" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
    <text x="376" y="658" class="t">5a. Börvärden</text>
    <text x="376" y="682" class="s">LK-termostater per rum</text>
    <text x="376" y="700" class="s">climate.set_temperature</text>
    <text x="376" y="718" class="m">rådgivande</text>

    <rect x="690" y="630" width="310" height="100" rx="12" fill="#fffbeb" stroke="#fbbf24" stroke-width="2"/>
    <text x="706" y="658" class="t">5b. EXT-block</text>
    <text x="706" y="682" class="s">Rego 1000 via H66</text>
    <text x="706" y="700" class="s">port 1 = stoppa värme</text>
    <text x="706" y="718" class="m">hård stopp</text>

    <text x="360" y="770" class="s">Styrning är avstängd tills «Styr värmen» slås på.</text>
    <text x="360" y="792" class="s">Vakten räknar även med EXT avstängt — du kan följa den i HA först.</text>
    <text x="360" y="820" class="t">Loop: samla → lär → planera → vaka → styra → spara</text>
  </g>

  <!-- outputs -->
  <g>
    <rect x="1100" y="160" width="240" height="100" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
    <text x="1116" y="186" class="t">Webbpanel</text>
    <text x="1116" y="208" class="s">Plan · toppar · prioritet</text>
    <text x="1116" y="226" class="s">FastAPI + static UI</text>
    <text x="1116" y="246" class="m">:47318</text>

    <rect x="1100" y="286" width="240" height="120" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <text x="1116" y="312" class="t">HA via MQTT</text>
    <text x="1116" y="334" class="s">Pris · tröskel · vakt</text>
    <text x="1116" y="352" class="s">Rumsprioritet-reglage</text>
    <text x="1116" y="370" class="s">Dashboard-vy</text>
    <text x="1116" y="390" class="m">kostnadsoptimering</text>

    <rect x="1100" y="432" width="240" height="110" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
    <text x="1116" y="458" class="t">LK Arc Hub</text>
    <text x="1116" y="480" class="s">11 rum, två plan</text>
    <text x="1116" y="498" class="s">Börvärde per zon</text>
    <text x="1116" y="516" class="s">Golvvärme styr flöde</text>

    <rect x="1100" y="568" width="240" height="110" rx="12" fill="#fffbeb" stroke="#fbbf24" stroke-width="2"/>
    <text x="1116" y="594" class="t">IVT Rego 1000</text>
    <text x="1116" y="616" class="s">Kompressor + VV</text>
    <text x="1116" y="634" class="s">EXT stoppar hårt</text>
    <text x="1116" y="652" class="s">H66 = brygga</text>

    <rect x="1100" y="704" width="240" height="90" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="1116" y="730" class="t">Lärdom tillbaka</text>
    <text x="1116" y="752" class="s">Mätta toppar &amp; tröghet</text>
    <text x="1116" y="770" class="s">matas in i SQLite</text>
  </g>

  <!-- arrows -->
  <path d="M280 205 H340" fill="none" stroke="#0ea5e9" stroke-width="2" marker-end="url(#a)"/>
  <text x="286" y="198" class="lbl">priser</text>
  <path d="M280 323 H340" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#a)"/>
  <text x="286" y="316" class="lbl">states</text>
  <path d="M280 441 H360" fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#a)"/>
  <text x="286" y="434" class="lbl">ute °C</text>
  <path d="M280 549 H360" fill="none" stroke="#eab308" stroke-width="2" marker-end="url(#a)"/>
  <text x="286" y="542" class="lbl">prio</text>
  <path d="M280 657 H360" fill="none" stroke="#a855f7" stroke-width="2" marker-end="url(#a)"/>
  <text x="286" y="650" class="lbl">modeller</text>

  <path d="M460 255 V290" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <path d="M710 255 V290" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <path d="M690 440 V470" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#at)"/>
  <path d="M505 600 V630" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#at)"/>
  <path d="M845 600 V630" fill="none" stroke="#b45309" stroke-width="3" marker-end="url(#aa)"/>

  <path d="M1020 340 H1100" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#at)"/>
  <text x="1025" y="332" class="lbl">status</text>
  <path d="M650 680 H1100" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#a)"/>
  <text x="860" y="672" class="lbl">börvärden</text>
  <path d="M1000 680 H1100" fill="none" stroke="#b45309" stroke-width="3" marker-end="url(#aa)"/>
  <text x="1010" y="704" class="lbl">EXT</text>

  <path d="M1220 794 V880 H155 V702" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="520" y="900" class="lbl">feedback: mätta toppar &amp; tröghet → SQLite</text>
</svg>
