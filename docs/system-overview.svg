<text x="48" y="48" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700">hemopt — vad körs var</text>
<text x="48" y="79" fill="#64748b" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400">Allt vårt körs på samma Raspberry Pi som Home Assistant. Ingen extra dator, ingen kod på ESP32 eller STM32.</text>
<text x="60" y="128" fill="#ffffff" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700">MOLN</text>
<text x="1540" y="127" fill="#d1fae5" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" text-anchor="end">Läses över HTTPS · ingen egen kod</text>
<text x="336" y="178" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700">elprisetjustnu.se — Nordpool</text>
<text x="336" y="202" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">SE1–SE4 · dygn / timme / kvart</text>
<text x="786" y="178" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700">Väderprognos</text>
<text x="786" y="202" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">Timtemperatur 36 h framåt</text>
<text x="60" y="281" fill="#ffffff" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700">RASPBERRY PI — HOME ASSISTANT OS</text>
<text x="1540" y="281" fill="#ffffff" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" text-anchor="end">HÄR KÖRS ALLT VÅRT</text>
<text x="86" y="338" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700">Home Assistant Core</text>
<text x="86" y="360" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">Det du ser och rör</text>
<text x="102" y="402" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700">Lovelace-vyer</text>
<text x="102" y="426" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">Kostnadsoptimering · Energi</text>
<text x="102" y="445" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">Summerad kostnad dag / månad</text>
<text x="102" y="488" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700">Reglage</text>
<text x="102" y="512" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">Slå på styrning · prioritet 1–5</text>
<text x="102" y="531" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">Regler för effekttoppar</text>
<text x="102" y="550" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">Välj elområde och elavtal</text>
<text x="102" y="594" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700">Enheter</text>
<text x="102" y="618" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">Lägg till rumsgivare, elmätare</text>
<text x="102" y="664" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700">Recorder</text>
<text x="102" y="688" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">Historiken modellen tränar på</text>
<text x="574" y="342" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700">Mosquitto</text>
<text x="574" y="364" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">MQTT-broker</text>
<text x="574" y="383" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">(HA add-on)</text>
<text x="574" y="420" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">Bär:</text>
<text x="574" y="442" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">· H66-data</text>
<text x="574" y="461" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">· hemopts</text>
<text x="574" y="480" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">  entiteter</text>
<text x="574" y="499" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">· discovery</text>
<text x="748" y="340" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700">hemopt — Home Assistant Add-on</text>
<text x="748" y="362" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">Egen container, startas av HA Supervisor. Python + HiGHS.</text>
<text x="764" y="408" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700">Samla + Lär</text>
<text x="764" y="432" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">States och historik</text>
<text x="764" y="451" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">Tröghet per rum</text>
<text x="764" y="470" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">VV-vanor, baslast</text>
<text x="1030" y="408" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700">Planerare</text>
<text x="1030" y="432" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">LP via HiGHS</text>
<text x="1030" y="451" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">36 h i kvartssteg</text>
<text x="1030" y="470" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">Löser på ~0,3 s</text>
<text x="1296" y="408" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700">Effektvakt</text>
<text x="1296" y="432" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">Varje minut</text>
<text x="1296" y="451" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">Mot klocktimmen</text>
<text x="1296" y="470" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">EXT-block vid behov</text>
<text x="764" y="564" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700">Avtalssimulator</text>
<text x="764" y="588" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">Dag / tim / kvart</text>
<text x="764" y="607" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">Kostnad för alla tre</text>
<text x="764" y="626" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">Ger rekommendation</text>
<text x="1030" y="564" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700">SQLite</text>
<text x="1030" y="588" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">Modeller och toppar</text>
<text x="1030" y="607" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">Mätserier</text>
<text x="1030" y="626" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">Överlever omstart</text>
<text x="1296" y="564" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700">Setup-UI</text>
<text x="1296" y="588" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">Via HA Ingress</text>
<text x="1296" y="607" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">Välj entiteter och rum</text>
<text x="1296" y="626" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">Elområde och avtal</text>
<text x="60" y="788" fill="#ffffff" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700">HUSETS NÄTVERK — GIVARE OCH FÄLTBUSS</text>
<text x="1540" y="787" fill="#d1fae5" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" text-anchor="end">Ingen egen kod · bara HA-integrationer</text>
<text x="86" y="842" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700">Husdata H66</text>
<text x="86" y="866" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">CAN till MQTT-brygga</text>
<text x="86" y="885" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">Läser IVT Rego 1000</text>
<text x="86" y="904" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">EXT-portar = hård stopp</text>
<text x="456" y="842" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700">LK Arc Hub</text>
<text x="456" y="866" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">11 rumsgivare, två plan</text>
<text x="456" y="885" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">Börvärde per zon</text>
<text x="796" y="842" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700">Elmätare (HAN / P1)</text>
<text x="796" y="866" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">Hela husets effekt</text>
<text x="796" y="885" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">Krävs för effekttoppar</text>
<text x="796" y="908" fill="#b45309" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700">← koppla in denna</text>
<text x="1176" y="842" fill="#64748b" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700">ESP32 / STM32</text>
<text x="1176" y="866" fill="#94a3b8" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">Behövs inte.</text>
<text x="1176" y="885" fill="#94a3b8" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">H66 är redan bryggan.</text>
<text x="1176" y="904" fill="#94a3b8" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">LP-lösaren ryms inte i en MCU.</text>
<text x="60" y="1000" fill="#ffffff" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700">DEPLOY — INGEN KLIPP-OCH-KLISTRA</text>
<text x="1540" y="999" fill="#d1fae5" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" text-anchor="end">Uppdateringar kommer som en knapp i HA</text>
<text x="86" y="1054" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700">1. Git-repo</text>
<text x="86" y="1078" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">Add-on repository</text>
<text x="456" y="1054" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700">2. HA → Add-ons</text>
<text x="456" y="1078" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">Lägg till repository-URL</text>
<text x="826" y="1054" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700">3. Installera</text>
<text x="826" y="1078" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">Ett klick, HA bygger</text>
<text x="1196" y="1054" fill="#0f172a" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700">4. Uppdatera</text>
<text x="1196" y="1078" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400">Knapp när ny version finns</text>
<text x="48" y="1153" fill="#64748b" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400">Hushållsprofilen (rum, entiteter, elavtal, elområde) är data — inte kod. Samma add-on installeras oförändrad i nästa hushåll.</text>
<text x="892" y="237" fill="#64748b" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="400">priser + väderprognos</text>
<text x="312" y="747" fill="#64748b" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="400">MQTT</text>
<text x="972" y="747" fill="#64748b" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="400">REST + MQTT</text>
</svg>