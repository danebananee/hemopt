name: Kostnadsoptimering (hemopt)
version: "0.1.0"
slug: hemopt
description: >-
  Flyttar uppvarmning och varmvatten till billiga timmar, kapar effekttoppar och
  jamfor vad de olika elavtalen skulle ha kostat.
url: https://github.com/bengtsson-daniel/hemopt
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto

# Ingress puts the control panel inside Home Assistant's own sidebar, so there
# is no extra port to open and no separate login.
ingress: true
ingress_port: 8099
panel_icon: mdi:cash-clock
panel_title: Kostnadsoptimering
panel_admin: true

# Supplies SUPERVISOR_TOKEN, which the add-on uses to reach the Home Assistant
# API. The user never has to create a long-lived access token.
homeassistant_api: true
# Needed to read the broker's host and credentials back from the Services API.
hassio_api: true

# "want" means the add-on starts even without a broker, but is handed the
# broker's host and credentials automatically when Mosquitto is installed.
services:
  - mqtt:want

# /data survives add-on updates; the learned models and peak history live there.
map:
  - addon_config:rw

options:
  price_area: SE3
  contract: hourly
  log_level: info

schema:
  price_area: list(SE1|SE2|SE3|SE4)
  contract: list(daily|hourly|quarterly)
  log_level: list(debug|info|warning|error)
