name: Kostnadsoptimering (hemopt)
version: "0.1.5"
slug: hemopt
description: >-
  Flyttar uppvarmning och varmvatten till billiga timmar, kapar effekttoppar och
  jamfor vad de olika elavtalen skulle ha kostat.
# Kors av scripts/set-repo-url.sh nar repot har fatt sin riktiga adress.
url: https://github.com/danebananee/hemopt
# 32-bit ARM is left out on purpose: numpy publishes armv7 wheels but HiGHS
# does not, so an armv7 install would try to compile the solver on the device.
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto

# Ingress puts the control panel inside Home Assistant's own sidebar, so there
# is no extra port to open and no separate login.
ingress: true
ingress_port: 8099
panel_icon: mdi:cash-clock
panel_title: Kostnadsoptimering
panel_admin: true

# Supplies SUPERVISOR_TOKEN, which the add-on uses to reach the Home Assistant
# API. The user never has to create a long-lived access token.
homeassistant_api: true
# Needed to read the broker's host and credentials back from the Services API.
hassio_api: true

# "want" means the add-on starts even without a broker, but is handed the
# broker's host and credentials automatically when Mosquitto is installed.
services:
  - mqtt:want

# /data survives add-on updates; the learned models and peak history live there.
# homeassistant_config lets you drop hemopt.yaml next to configuration.yaml.
map:
  - addon_config:rw
  - homeassistant_config:rw

options:
  price_area: SE3
  contract: hourly
  log_level: info
  peak_enabled: true
  peak_n_peaks: 5
  peak_price_per_kw: 67.5
  peak_hour_start: 7
  peak_hour_end: 21
  peak_weekdays_only: true
  total_power_entity: ""

schema:
  price_area: list(SE1|SE2|SE3|SE4)
  contract: list(daily|hourly|quarterly)
  log_level: list(debug|info|warning|error)
  peak_enabled: bool
  peak_n_peaks: int(1,10)
  peak_price_per_kw: float(0,500)
  peak_hour_start: int(0,23)
  peak_hour_end: int(1,24)
  peak_weekdays_only: bool
  total_power_entity: str?
