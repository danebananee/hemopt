name: Kostnadsoptimering (hemopt)
version: "0.1.15"
slug: hemopt
description: >-
  Flyttar uppvarmning och varmvatten till billiga timmar, kapar effekttoppar och
  jamfor vad de olika elavtalen skulle ha kostat.
url: https://github.com/danebananee/hemopt
arch:
  - aarch64
  - amd64
init: false

ingress: true
panel_icon: mdi:cash-clock
panel_title: Kostnadsoptimering

homeassistant_api: true
hassio_api: true

services:
  - mqtt:want

map:
  - addon_config:rw
  - homeassistant_config:rw

options:
  price_area: SE3
  contract: daily
  log_level: info
  peak_enabled: true
  peak_n_peaks: 5
  peak_price_per_kw: 67.5
  peak_hour_start: 7
  peak_hour_end: 21
  peak_weekdays_only: true
  total_power_entity: ""
  weather_entity: weather.forecast_home
  ha_url: http://homeassistant:8123
  ha_token: ""
  mqtt_host: core-mosquitto
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""

schema:
  price_area: list(SE1|SE2|SE3|SE4)
  contract: list(daily|hourly|quarterly)
  log_level: list(debug|info|warning|error)
  peak_enabled: bool
  peak_n_peaks: int(1,10)
  peak_price_per_kw: float(0,500)
  peak_hour_start: int(0,23)
  peak_hour_end: int(1,24)
  peak_weekdays_only: bool
  total_power_entity: str?
  weather_entity: str?
  ha_url: str?
  ha_token: password?
  mqtt_host: str?
  mqtt_port: int(1,65535)?
  mqtt_username: str?
  mqtt_password: password?
