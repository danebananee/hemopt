    name: Vardagsrum
    floor: Overvaning
    priority: 3
    temperature_entity: sensor.fa_6a_ee_c8_9a_63_temperature
    humidity_entity: sensor.fa_6a_ee_c8_9a_63_humidity
    climate_entity: climate.fa_6a_ee_c8_9a_63      # KONTROLLERA
    comfort_min: 21.0
    comfort_max: 22.5
    heat_share: 2.2

