# hemopt - konfiguration for huset med IVT Rego 1000, Husdata H66 och LK Arc
#
# Kopiera till config.yaml och fyll i token. Kor sedan
#
#     uv run hemopt -c config.yaml doctor
#
# som kontrollerar att varenda entitet nedan finns i Home Assistant och
# foreslar rattningar for dem som inte gor det. Gissade entiteter ar markta
# med KONTROLLERA.

site:
  price_area: SE3
  timezone: Europe/Stockholm
  # Fran fakturan: Enkeltariff E4, 25 A, elomrade 3, omrades-ID DRV.
  main_fuse_amps: 25
  # KONTROLLERA. Utan vaderprognos antar planeraren att det ar lika varmt om
  # 36 timmar som just nu, vilket felbedomer all forvarmning.
  weather_entity: weather.forecast_home

home_assistant:
  base_url: http://homeassistant.local:8123
  token: KLISTRA_IN_LANGLIVAD_TOKEN
  history_days: 21

mqtt:
  enabled: true
  host: homeassistant.local
  port: 1883
  username: mqtt_user
  password: BYT_MIG

# ---------------------------------------------------------------------------
# Pris. Siffrorna nedan ar rimliga for SE3 men ar inte dina. Ta dem fran
# elnatsfakturan respektive elhandelsavtalet.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# Pris. Siffrorna nedan ar hamtade ur fakturan for augusti 2026 och ar
# exklusive moms, precis som fakturan redovisar dem.
# ---------------------------------------------------------------------------
energy_price:
  # "Rorligt Elpris" hos Vattenfall ar manadsmedelspot: varje kWh debiteras
  # till manadens medelpris. Da ger lastflytt ingenting pa energidelen.
  # Radgivningen papekar detta; byt till hourly nar avtalet ar bytt.
  contract: monthly
  vat_rate: 0.25
  supplier_markup_ore: 7.00      # Fast paslag spot
  certificate_ore: 1.40          # Fast paslag elcertifikat
  balancing_ore: 5.76            # Rorliga kostnader, varierar per manad
  energy_tax_ore: 36.00          # Energiskatt 2026
  # Enkeltariff: samma overforingsavgift dygnet runt, sa det finns inget att
  # tjana pa natsidan genom att flytta last. Bada varden ar darfor lika.
  transfer_fee_high_ore: 35.60
  transfer_fee_normal_ore: 35.60
  grid_subscription_sek_per_year: 8100.0   # Abonnemang, Enkeltariff E4 25 A
  supplier_fee_sek_per_year: 432.0         # Arsavgift elhandel

# ---------------------------------------------------------------------------
# Radgivning om sjalva avtalen.
#
# Kontrollera abonnemangspriserna nedan mot natbolagets aktuella prislista
# innan du agerar pa ett sakringsrad; bara 25 A-raden ar hamtad ur fakturan.
# ---------------------------------------------------------------------------
advice:
  enabled: true
  min_annual_saving_sek: 200
  fuse_margin_kw: 2.0
  min_history_days: 30
  flexible_share: 0.5
  grid_tariffs:
    - name: Enkeltariff E4 (25 A)
      fuse_amps: 25
      subscription_sek_per_year: 8100.0
      transfer_ore: 35.60
    - name: Enkeltariff E3 (20 A)
      fuse_amps: 20
      subscription_sek_per_year: 5900.0   # KONTROLLERA mot prislistan
      transfer_ore: 35.60
    - name: Enkeltariff E2 (16 A)
      fuse_amps: 16
      subscription_sek_per_year: 4200.0   # KONTROLLERA mot prislistan
      transfer_ore: 35.60
  supplier_offers: []

# ---------------------------------------------------------------------------
# Effektavgift.
#
# Avstangd som default eftersom Vattenfall Eldistribution pausade
# breddinforandet efter regeringens besked i mars 2026. Kolla elnatsfakturan.
# Nar en effektavgift dyker upp dar: satt enabled: true och stall in siffrorna
# efter din prislista. Alla natbolag ska ha infort en senast 2027-01-01.
#
# Modellen nedan ar Vattenfalls: snittet av de fem hogsta timmedeleffekterna
# pa olika dygn, matt helgfria vardagar 07-21 under november till mars.
# ---------------------------------------------------------------------------
peak_tariff:
  enabled: false
  n_peaks: 5
  price_per_kw_sek: 67.5
  window:
    months: [1, 2, 3, 11, 12]
    hour_start: 7
    hour_end: 21
    weekdays_only: true
    exclude_holidays: true

heat_pump:
  max_thermal_kw: 9.0
  max_electrical_kw: 3.2
  cop_at_minus_5: 3.1
  cop_at_plus_10: 4.6
  outdoor_entity: sensor.h66_hpoutdoor
  power_entity: sensor.h66_hppower_consumption

hot_water:
  enabled: true
  top_temperature_entity: sensor.h66_hpwarm_water_1_top
  tank_litres: 180
  min_temperature: 42
  target_temperature: 52
  max_temperature: 58
  reheat_power_kw: 3.0
  legionella_weekday: 6      # sondag, 0 = mandag. null stanger av
  legionella_temperature: 62

base_load:
  # HomeWizard P1: entitets-id ar oftast sensor.p1_meter_active_power
  # (summan av alla faser). Kolla under Utvecklarverktyg → Tillstand om
  # namnet skiljer sig, eller valj mataren i tillaggets panel.
  # Lamna tom om du inte har nagon, sa anvands default_kw i stallet.
  total_power_entity: sensor.p1_meter_active_power
  default_kw: 0.7
  learn_profile: true

# ---------------------------------------------------------------------------
# EXT-kabeln. Avstangd tills du vet vad portarna ar konfigurerade att gora i
# Rego 1000, under Extern ingang 1 och 2. En aktiverad EXT-signal stoppar
# funktionen direkt, sa slå inte på detta pa gissning.
# ---------------------------------------------------------------------------
ext_control:
  enabled: false
  block_heating_entity: climate.h66_hpext_control_port_1
  max_block_minutes: 120
  min_release_minutes: 15
  min_room_temperature: 18.0

optimiser:
  horizon_hours: 36
  step_minutes: 15
  run_interval_minutes: 15
  apply_controls: false      # slås på i webbpanelen nar du litar pa planen

# ---------------------------------------------------------------------------
# Rum.
#
# priority 3 = hall temperaturen, 1 = far svaja och bar lastflytten.
# heat_share ar rummets andel av varmeeffekten, ungefar proportionell mot
# golvytan. Bara forhallandet mellan rummen spelar roll.
#
# climate_entity ar gissad ur LK-integrationens namnsattning och maste
# kontrolleras. Utan den kan hemopt lasa rummet men inte styra det, och
# tröghetsmodellen faller tillbaka pa standardvarden.
# ---------------------------------------------------------------------------
rooms:
