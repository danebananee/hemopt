configuration:
  price_area:
    name: Elområde
    description: >-
      Ditt elområde. Södra Sverige är SE4, Stockholm och Göteborg ligger i SE3.
  contract:
    name: Avräkning av elavtal
    description: >-
      Hur ditt spotavtal avräknas. Kvart ger optimeraren mest att arbeta med,
      dygn ger minst. Tillägget simulerar också vad de andra två hade kostat.
  log_level:
    name: Loggnivå
    description: Höj till debug när något ser fel ut, sänk sedan tillbaka.
  peak_enabled:
    name: Minimera effekttoppar
    description: >-
      Slå på för att låta optimeraren hålla nere debiterbara toppar enligt
      elnätsavtalet.
  peak_n_peaks:
    name: Antal toppar som snittas
    description: Vanligt är 5 (snitt av de högsta topparna på olika dygn).
  peak_price_per_kw:
    name: Pris per kW (kr)
    description: Effektavgift enligt elnätsavtalet, kronor per kW och månad.
  peak_hour_start:
    name: Effektfönster från (timme)
    description: Timme på dygnet då toppar börjar räknas (ofta 7).
  peak_hour_end:
    name: Effektfönster till (timme)
    description: Timme då fönstret slutar (ofta 21).
  peak_weekdays_only:
    name: Bara vardagar
    description: Om bara vardagar (inte helg) räknas för effektavgiften.
  total_power_entity:
    name: Elmätare (entitets-id)
    description: >-
      Sensor för husets totala effekt, t.ex. sensor.p1_meter_active_power.
      Lämna tomt om den redan står i hemopt.yaml.
  ha_url:
    name: HA-URL (fallback)
    description: >-
      Används bara om SUPERVISOR_TOKEN saknas. Inne i tillägget är
      http://homeassistant:8123 rätt adress.
  ha_token:
    name: HA-token (fallback)
    description: >-
      Long-lived access token från din HA-profil. Behövs bara om Loggen visar
      SUPERVISOR_TOKEN length=0. Skapa under Profil → Säkerhet → Long-lived
      access tokens.
  weather_entity:
    name: Väderentitet
    description: >-
      Weather-entitet för timprognos, t.ex. weather.forecast_home. Utan den
      blir väderprognosen grå och planen antar att utetemperaturen håller i sig.
  mqtt_host:
    name: MQTT-host
    description: >-
      Mosquitto-host inne i HA, normalt core-mosquitto. Behövs för att hemopt
      ska publicera plan/status (värmepumpen styrs via Home Assistant-entiteter).
  mqtt_port:
    name: MQTT-port
    description: Vanligtvis 1883.
  mqtt_username:
    name: MQTT-användare
    description: Lämna tom om Mosquitto tillåter anonyma lokala klienter.
  mqtt_password:
    name: MQTT-lösenord
    description: Lösenordet du satte i Mosquitto broker → Configuration.
